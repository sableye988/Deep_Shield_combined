{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <h2>딥페이크 방지</h2>
  <p>이미지에 워터마크를 삽입하여 위변조를 방지합니다.</p>
</div>

<section class="detect-section">
  <div class="detect-container">
    <form id="prevent-form" method="POST" action="{{ url_for('prevent') }}" enctype="multipart/form-data" class="detect-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="image">이미지 업로드</label>
      <input type="file" id="image" name="image" accept="image/*" required>
      <p class="help">* 최대 {{ 20 }}MB까지 업로드 가능합니다.</p>
      <button type="submit">방지 시작</button>
    </form>

    <script>
      (function () {
        const MAX_MB = 20;
        const form = document.getElementById('prevent-form');
        const input = form.querySelector('#image');

        form.addEventListener('submit', function (e) {
          const f = input.files && input.files[0];
          if (!f) return;
          const sizeMB = f.size / (1024 * 1024);
          if (sizeMB > MAX_MB) {
            e.preventDefault();
            alert(`파일이 ${sizeMB.toFixed(2)}MB 입니다. 최대 ${MAX_MB}MB까지 업로드할 수 있습니다.`);
          }
        });
      })();
    </script>

    <!-- 결과 영역 -->
    <div class="detect-result-box">
      {% if result %}
        <h3>변형 결과</h3>
        <div class="result-images">
          <div>
            <p>원본 이미지</p>
            <img src="{{ result.original_url }}" alt="원본 이미지">
          </div>
          <div>
            <p>변형 이미지</p>
            <img src="{{ result.modified_url }}" alt="변형 이미지">
          </div>
        </div>
        <p>※ 변형된 이미지는 마이페이지에서 저장할 수 있습니다.</p>
      {% else %}
        <p class="placeholder">여기에 변형 결과가 표시됩니다.</p>
      {% endif %}
    </div>
  </div>
</section>

{% endblock %}
